name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Type-check — runs in parallel with test ──────────────────────
  typecheck:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

  # ── Job 2: Run tests — runs in parallel with typecheck ──────────────────
  test:
    name: Run UI + API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      WEB_BASE_URL: https://www.saucedemo.com
      STANDARD_USER: ${{ secrets.USERNAME }}
      STANDARD_PASSWORD: ${{ secrets.PASSWORD }}
      LOCKED_USER: locked_out_user
      API_BASE_URL: https://jsonplaceholder.typicode.com
      HEALTH_API_URL: http://localhost:8000
      BROWSER: chromium
      WORKERS: 4
      DEFAULT_TIMEOUT: 30000
      NAVIGATION_TIMEOUT: 30000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python for health API
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install health API dependencies
        run: pip install -r health_api/requirements.txt

      - name: Start health API
        run: uvicorn health_api.main:app --host 0.0.0.0 --port 8000 &
        env:
          WEB_BASE_URL: https://www.saucedemo.com
          API_BASE_URL: https://jsonplaceholder.typicode.com

      - name: Wait for health API to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/health/self && echo "Health API ready" && break
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      - name: Run all tests (chromium + api, 4 workers, fully parallel)
        run: npx playwright test --workers=4
        continue-on-error: true
        id: all-tests

      # Upload all artifacts before checking outcome so they are always available
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Check test outcomes
        if: always()
        run: |
          if [ "${{ steps.all-tests.outcome }}" = "failure" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✅ All tests passed"

  # ── Job 3: Generate Allure report — runs in parallel with summary ────────
  report:
    name: Generate Allure report
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Allure raw results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/
        continue-on-error: true

      - name: Restore Allure history cache
        uses: actions/cache/restore@v4
        with:
          path: allure-history/
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Copy Allure history into results
        run: |
          if [ -d allure-history ]; then
            cp -r allure-history allure-results/history
            echo "History restored"
          else
            echo "No previous history"
          fi

      - name: Generate Allure report
        run: npm run report:allure:ci

      - name: Copy generated history to cache dir
        run: |
          if [ -d allure-report/history ]; then
            rm -rf allure-history
            cp -r allure-report/history allure-history
          fi

      - name: Save Allure history cache
        uses: actions/cache/save@v4
        with:
          path: allure-history/
          key: allure-history-${{ github.run_id }}

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stage portal + Allure report for Pages
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages/allure-report
          cp -r allure-report/. pages/allure-report/
          cp index.html pages/index.html
          cp Architecture.html pages/Architecture.html
          touch pages/.nojekyll

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages/

  # ── Job 4: Step summary — runs in parallel with report ──────────────────
  summary:
    name: Report test results
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/
        continue-on-error: true

      - name: Report test results
        run: |
          node -e "
            const fs = require('fs');
            const p = 'test-results/results.json';
            if (!fs.existsSync(p)) { console.log('No results.json'); process.exit(0); }
            const { stats, suites } = JSON.parse(fs.readFileSync(p, 'utf8'));

            const dur = stats.duration < 60000
              ? (stats.duration / 1000).toFixed(1) + 's'
              : Math.floor(stats.duration / 60000) + 'm ' + ((stats.duration % 60000) / 1000).toFixed(0) + 's';

            function allSpecs(suites) {
              return suites.flatMap(s => [...(s.specs || []), ...allSpecs(s.suites || [])]);
            }
            const specs = allSpecs(suites);
            const flakySpecs  = specs.filter(s => s.tests?.some(t => t.results?.length > 1 && t.results.at(-1)?.status === 'passed'));
            const failedSpecs = specs.filter(s => s.tests?.some(t => t.results?.at(-1)?.status === 'failed' || t.results?.at(-1)?.status === 'timedOut'));

            const icon  = stats.unexpected > 0 ? '✗' : stats.flaky > 0 ? '~' : '✓';
            const label = stats.unexpected > 0 ? 'FAILED' : stats.flaky > 0 ? 'FLAKY' : 'PASSED';

            let md = \`## \${icon} Test results — \${label}\n\n\`;
            md += '| Metric | Value |\n|---|---|\n';
            md += \`| Total   | \${stats.expected + stats.unexpected + stats.skipped} |\n\`;
            md += \`| Passed  | \${stats.expected} |\n\`;
            md += \`| Failed  | \${stats.unexpected} |\n\`;
            md += \`| Skipped | \${stats.skipped} |\n\`;
            md += \`| Flaky   | \${stats.flaky} |\n\`;
            md += \`| Duration | \${dur} |\n\`;
            if (flakySpecs.length)  { md += '\n### Flaky tests\n';  flakySpecs.forEach(s  => md += \`- \${s.title}\n\`); }
            if (failedSpecs.length) { md += '\n### Failed tests\n'; failedSpecs.forEach(s => md += \`- \${s.title}\n\`); }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);

            const rows = [['Total', String(stats.expected + stats.unexpected + stats.skipped)], ['Passed', String(stats.expected)], ['Failed', String(stats.unexpected)], ['Skipped', String(stats.skipped)], ['Flaky', String(stats.flaky)], ['Duration', dur]];
            const colW = Math.max(...rows.map(([k]) => k.length)) + 2;
            const valW = Math.max(...rows.map(([,v]) => v.length)) + 2;
            const line = '─'.repeat(colW + valW + 3);
            console.log('\n' + line);
            console.log('  Test results  ' + icon + ' ' + label);
            console.log(line);
            rows.forEach(([k, v]) => console.log('  ' + k.padEnd(colW) + v.padStart(valW)));
            console.log(line + '\n');
          "

      - name: Write server links to step summary
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ALLURE_URL="https://amielnoy.github.io/Ai-typescript-playwright-Parrallel-githubActionsAutomationTests/allure-report/"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ## 🔗 Server Links

          | Server | URL |
          |---|---|
          | 📊 Allure Report (GitHub Pages) | [$ALLURE_URL]($ALLURE_URL) |
          | 📦 Playwright Report (artifact) | [Download from this run]($RUN_URL) |
          EOF

  # ── Job 5: Deploy to GitHub Pages — needs report ────────────────────────
  deploy-pages:
    name: Deploy Allure report to GitHub Pages
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
