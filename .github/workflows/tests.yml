name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run UI + API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Web target
      WEB_BASE_URL: https://www.saucedemo.com
      STANDARD_USER: ${{ secrets.USERNAME }}
      STANDARD_PASSWORD: ${{ secrets.PASSWORD }}
      LOCKED_USER: locked_out_user
      # API target
      API_BASE_URL: https://jsonplaceholder.typicode.com
      # Playwright
      BROWSER: chromium
      WORKERS: 4
      DEFAULT_TIMEOUT: 30000
      NAVIGATION_TIMEOUT: 30000

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Dependencies ──────────────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci
      # ── Java runtime for Allure report generation ───────────────────────────
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
      # ── Type-check ────────────────────────────────────────────────────────
      - name: TypeScript type-check
        run: npm run typecheck

      # ── Playwright browsers ───────────────────────────────────────────────
      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      # ── Tests: all projects in parallel ──────────────────────────────────
      - name: Run all tests (chromium + api, 4 workers, fully parallel)
        run: npx playwright test --workers=4
        continue-on-error: true
        id: all-tests

      # ── Restore Allure history from previous run ──────────────────────────
      - name: Download previous Allure report (for history)
        if: always()
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: allure-report
          path: allure-report-prev/
          if_no_artifact_found: ignore

      - name: Copy Allure history into results
        if: always()
        run: |
          if [ -d allure-report-prev/history ]; then
            cp -r allure-report-prev/history allure-results/
            echo "History restored"
          else
            echo "No previous history"
          fi

      # ── Generate Allure 3 HTML report from raw results ───────────────────
      - name: Generate Allure report
        if: always()
        run: npm run report:allure:ci

      # ── Flaky test summary ────────────────────────────────────────────────
      - name: Report flaky tests
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const path = 'test-results/results.json';
            if (!fs.existsSync(path)) { console.log('No results.json'); process.exit(0); }
            const { suites } = JSON.parse(fs.readFileSync(path, 'utf8'));
            const all = suites.flatMap(s => [s, ...(s.suites ?? [])]).flatMap(s => s.specs ?? []);
            const flaky = all.filter(s => s.tests?.some(t => t.results?.length > 1 && t.results.at(-1)?.status === 'passed'));
            const failed = all.filter(s => s.tests?.every(t => t.results?.at(-1)?.status !== 'passed') && s.tests?.some(t => t.results?.length));
            let md = '## Test run summary\n';
            md += '| Metric | Count |\n|---|---|\n';
            md += \`| Total specs | \${all.length} |\n\`;
            md += \`| Flaky (passed after retry) | \${flaky.length} |\n\`;
            md += \`| Failed | \${failed.length} |\n\`;
            if (flaky.length) { md += '\n### Flaky tests\n'; flaky.forEach(s => md += \`- \${s.title}\n\`); }
            if (failed.length) { md += '\n### Failed tests\n'; failed.forEach(s => md += \`- \${s.title}\n\`); }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            console.log(md);
          "

      # ── Upload Playwright HTML report ─────────────────────────────────────
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # ── Upload Allure 3 HTML report ───────────────────────────────────────
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: ignore

      # ── Upload raw Allure results (for history trend across runs) ─────────
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
          if-no-files-found: ignore

      # ── Upload failure artifacts (traces, screenshots, videos) ────────────
      - name: Upload test failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # ── Fail the job if tests failed ─────────────────────────────────────
      - name: Check test outcomes
        if: always()
        run: |
          if [ "${{ steps.all-tests.outcome }}" = "failure" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✅ All tests passed"

      # ── Upload Allure report as Pages artifact ────────────────────────
      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  # ── Deploy to GitHub Pages (main branch only) ─────────────────────────
  deploy-pages:
    name: Deploy Allure report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
