name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run UI + API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Web target
      WEB_BASE_URL: https://www.saucedemo.com
      STANDARD_USER: ${{ secrets.USERNAME }}
      STANDARD_PASSWORD: ${{ secrets.PASSWORD }}
      LOCKED_USER: locked_out_user
      # API target
      API_BASE_URL: https://jsonplaceholder.typicode.com
      # Playwright
      BROWSER: chromium
      WORKERS: 4
      DEFAULT_TIMEOUT: 30000
      NAVIGATION_TIMEOUT: 30000

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Dependencies ──────────────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── Type-check ────────────────────────────────────────────────────────
      - name: TypeScript type-check
        run: npm run typecheck

      # ── Playwright browsers ───────────────────────────────────────────────
      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      # ── Tests: UI (chromium only in CI for speed) ─────────────────────────
      - name: Run UI tests (chromium, 4 workers)
        run: npx playwright test --project=chromium tests/ui --workers=4
        continue-on-error: true
        id: ui-tests

      # ── Tests: API ────────────────────────────────────────────────────────
      - name: Run API tests
        run: npx playwright test --project=api tests/api --workers=4
        id: api-tests

      # ── Generate Allure 3 HTML report from raw results ───────────────────
      # allure-playwright writes JSON to allure-results/ during the test run.
      # allure-commandline (bundled in devDeps) compiles them into a static site.
      - name: Generate Allure report
        if: always()
        run: npm run report:allure:ci

      # ── Upload Playwright HTML report ─────────────────────────────────────
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # ── Upload Allure 3 HTML report ───────────────────────────────────────
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: ignore

      # ── Upload raw Allure results (for history trend across runs) ─────────
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
          if-no-files-found: ignore

      # ── Upload failure artifacts (traces, screenshots, videos) ────────────
      - name: Upload test failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # ── Fail the job if any test step failed ─────────────────────────────
      - name: Check test outcomes
        if: always()
        run: |
          if [ "${{ steps.ui-tests.outcome }}" = "failure" ]; then
            echo "❌ UI tests failed"
            exit 1
          fi
          if [ "${{ steps.api-tests.outcome }}" = "failure" ]; then
            echo "❌ API tests failed"
            exit 1
          fi
          echo "✅ All tests passed"

      # ── Upload Allure report as Pages artifact ────────────────────────
      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  # ── Deploy to GitHub Pages (main branch only) ─────────────────────────
  deploy-pages:
    name: Deploy Allure report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
