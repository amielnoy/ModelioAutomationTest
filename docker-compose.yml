services:

  # ── Health & Swagger API ──────────────────────────────────────────────────
  health-api:
    build: ./health_api
    ports:
      - "8000:8000"
    environment:
      WEB_BASE_URL:    ${WEB_BASE_URL:-https://www.saucedemo.com}
      API_BASE_URL:    ${API_BASE_URL:-https://jsonplaceholder.typicode.com}
      PROMETHEUS_URL:  http://prometheus:9090/-/healthy
      GRAFANA_URL:     http://grafana:3000/api/health
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/self')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      health-api:
        condition: service_healthy

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ── Playwright test runner ────────────────────────────────────────────────
  tests:
    build: .
    environment:
      CI:                 "true"
      WEB_BASE_URL:       ${WEB_BASE_URL:-https://www.saucedemo.com}
      STANDARD_USER:      ${STANDARD_USER:-standard_user}
      STANDARD_PASSWORD:  ${STANDARD_PASSWORD:-secret_sauce}
      LOCKED_USER:        ${LOCKED_USER:-locked_out_user}
      API_BASE_URL:       ${API_BASE_URL:-https://jsonplaceholder.typicode.com}
      HEALTH_API_URL:     http://health-api:8000
      BROWSER:            ${BROWSER:-chromium}
      WORKERS:            ${WORKERS:-4}
      DEFAULT_TIMEOUT:    ${DEFAULT_TIMEOUT:-30000}
      NAVIGATION_TIMEOUT: ${NAVIGATION_TIMEOUT:-30000}
    volumes:
      # Source mounts — override the baked-in COPY so local edits take effect
      # without rebuilding the image. node_modules stays inside the container.
      - ./playwright.config.ts:/app/playwright.config.ts:ro
      - ./config.json:/app/config.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      # Output mounts — written by the container, read on the host
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/allure-report
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
      - ./logs:/app/logs
    depends_on:
      health-api:
        condition: service_healthy
